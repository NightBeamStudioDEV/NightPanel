name: Dependency Audit

on:
  pull_request:
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses
      - run: npm ci
      - name: Audit production npm licenses
        run: npx --yes license-checker-rseidelsohn@4.4.2 --production --onlyAllow 'Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;MIT;MPL-2.0;0BSD;CC0-1.0;BlueOak-1.0.0'

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
