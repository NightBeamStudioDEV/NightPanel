[package]
name = "night-panel"
version = "1.0.0"
description = "Desktop operations console for NightWatch Pro"
authors = ["NightBeam contributors"]
homepage = "https://github.com/NightBeamStudioDEV/NightPanel"
repository = "https://github.com/NightBeamStudioDEV/NightPanel"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "night_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
